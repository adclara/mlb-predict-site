function pitcherCard(team){const t=teams[team];return`<article class="card pitcher-card">${cardhead(`Abridor probable · ${team}`,'',`<button class="textbtn" ${act('pitcher-detail',`data-team="${team}"`)} aria-label="Ver ${esc(t.pitcher)}">${ic('chevron')}</button>`)}<div class="pitcher-profile"><img class="pitcher-portrait" src="${ASSETS['pitcher-'+(team==='CIN'?'reds':'brewers')+'.webp']}" alt="Retrato ilustrativo del diseño"><div class="grow"><h3 class="pitcher-name">${t.pitcher}</h3><small class="muted">${t.hand} · #${t.jersey}</small><div class="mt8">${chip('POR CONFIRMAR','goldchip')}</div></div></div><div class="stats4 num"><div><b>${t.wl}</b><span>G – P</span></div><div><b>${t.era.toFixed(2)}</b><span>ERA</span></div><div><b>${t.whip.toFixed(2)}</b><span>WHIP</span></div><div><b>${t.k}</b><span>PONCHES</span></div></div></article>`}
function periodVs(team){const a=teams[team].vs;if(state.period==='1')return{w:1,l:1,nd:1,starts:3,teamWins:2,era:team==='MIL'?3.14:4.12,whip:team==='MIL'?1.17:1.31};if(state.period==='career')return{w:a.w+2,l:a.l+1,nd:a.nd+2,starts:a.starts+5,teamWins:a.teamWins+3,era:team==='MIL'?3.02:4.06,whip:team==='MIL'?1.15:1.29};return a}
function h2hCard(){const a=periodVs(state.pitcher);return`<article class="card h2h-card">${cardhead('Pitcher contra el rival','',`<button class="tooltip-btn" ${act('pitcherinfo')} aria-label="Cómo se calcula el historial">${ic('info')}</button>`)}<div class="segmented">${['CIN','MIL'].map(t=>`<button class="${state.pitcher===t?'active':''}" ${act('pitcher',`data-team="${t}"`)}>${t==='CIN'?'Abbott vs MIL':'Peralta vs CIN'}</button>`).join('')}</div><div class="stats-row num"><div><b>${a.w} – ${a.l}</b><small>DECISIONES</small></div><div><b class="${state.pitcher==='MIL'?'green':'red'}">${pct(a.w,a.w+a.l)}</b><small>% VICTORIAS</small></div><div><b>${a.era.toFixed(2)}</b><small>ERA</small></div><div><b>${a.starts}</b><small>APERTURAS</small></div></div><div class="flex between wrap"><span class="subnote">Equipo ganó ${a.teamWins}/${a.starts} · ${pct(a.teamWins,a.starts)}<br>${a.nd} sin decisión para el pitcher</span><select class="select" data-change="period" aria-label="Período del enfrentamiento"><option value="1" ${state.period==='1'?'selected':''}>Esta temporada</option><option value="3" ${state.period==='3'?'selected':''}>Últimas 3 temporadas</option><option value="career" ${state.period==='career'?'selected':''}>Carrera</option></select></div></article>`}
function lineChart(){const vals=[61,59.8,60.6,60.7,62,62.9,63.7,64.6],m=[58.8,59.5,59.7,60.3,61,61.8,63.1,64.4];const pt=(arr)=>arr.map((v,i)=>`${30+i*43},${145-(v-50)*5}`).join(' ');return`<svg class="chart-svg" viewBox="0 0 352 176" role="img" aria-label="Evolución ilustrativa: modelo 64.6 por ciento y mercado 64.4 por ciento"><defs><linearGradient id="chartfill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2393ff" stop-opacity=".25"/><stop offset="1" stop-color="#2393ff" stop-opacity="0"/></linearGradient></defs>${[50,55,60,65,70].map(v=>`<path class="gridline" d="M30 ${145-(v-50)*5}h303"/><text x="0" y="${148-(v-50)*5}">${v}%</text>`).join('')}${[30,116,202,288].map(x=>`<path class="gridline" d="M${x} 25v120"/>`).join('')}<polygon points="30,145 ${pt(vals)} 331,145" fill="url(#chartfill)"/><polyline points="${pt(m)}" stroke="#8698b5" stroke-width="2" fill="none"/><polyline points="${pt(vals)}" stroke="#44a6ff" stroke-width="2.5" fill="none"/>${vals.map((v,i)=>`<circle cx="${30+i*43}" cy="${145-(v-50)*5}" r="3" fill="#43aaff"><title>Ejemplo ${i+1}: ${v.toFixed(1)}%</title></circle>`).join('')}<text x="30" y="168">09:00</text><text x="116" y="168">10:00</text><text x="202" y="168">11:00</text><text x="295" y="168">Ejemplo</text></svg>`}
function miniMarkets(){const b=books[state.book];return`<article class="card">${cardhead('Líneas del mercado','market',chip('DEMO'))}<div class="market-mini">${[['MIL · ganador',b.home],['CIN · ganador',b.away],['Total de carreras','8.5'],['Alta / Baja',`${formatOdds(b.over)} / ${formatOdds(b.under)}`]].map(([a,c])=>`<div><span class="muted">${a}</span><b class="num">${state.dataState==='stale'?'—':typeof c==='number'?formatOdds(c):c}</b></div>`).join('')}</div><div class="mt8">${btn('Comparar líneas','route','outline-blue full','arrow','data-to="mercado"')}</div><p class="subnote mt8">Cotizaciones ficticias, no disponibles para apostar.</p></article>`}
function battingTable(compact=false,team=state.team){let rows=batters.filter(b=>b.team===team&&b.name.toLowerCase().includes(state.batterQuery.toLowerCase()));if(state.batterSort==='avg')rows.sort((a,b)=>(b.avg??-1)-(a.avg??-1));if(state.batterSort==='k')rows.sort((a,b)=>(b.k/(b.pa||1))-(a.k/(a.pa||1)));if(compact)rows=rows.slice(0,5);return`<div class="tablewrap" tabindex="0" aria-label="Historial bateador contra pitcher, datos demo"><table class="data-table"><thead><tr><th>Bateador</th><th>PA</th><th>H/AB</th><th>AVG</th>${compact?'':`<th>OBP</th><th>2B</th>`}<th>K%</th>${compact?'':`<th>Muestra</th>`}</tr></thead><tbody>${rows.map(b=>`<tr><td class="playercell"><button ${act('batter-detail',`data-id="${b.id}"`)}>${compact?b.name.replace(/^(\w)\w+ /,'$1. '):b.name} ${compact?'':ic('chevron').replace('class="icon ','class="icon ').replace('<svg','<svg style="width:11px;height:11px"')}</button></td><td>${b.pa||'—'}</td><td>${b.ab?b.h+'/'+b.ab:'—'}</td><td>${b.avg==null?'—':b.avg.toFixed(3).slice(1)}</td>${compact?'':`<td>${b.obp==null?'—':b.obp.toFixed(3).slice(1)}</td><td>${b.ab?b.doubles:'—'}</td>`}<td>${pct(b.k,b.pa,0)}</td>${compact?'':`<td>${b.pa?chip('Pequeña','goldchip'):'Sin historial'}</td>`}</tr>`).join('')||'<tr><td colspan="8">Sin coincidencias.</td></tr>'}</tbody></table></div>`}
function teamSwitcher(action='team',selected=state.team){return`<div class="segmented">${['CIN','MIL'].map(t=>`<button ${act(action,`data-team="${t}"`)} class="${selected===t?'active':''}">${teams[t].nick}</button>`).join('')}</div>`}
function overview(){return`<div class="overview-grid">${probabilityCard()}<article class="card value-card">${cardhead('Valor y evidencia','',`<button class="tooltip-btn" ${act('valueinfo')} aria-label="Diferencia de probabilidad y valor">${ic('info')}</button>`)}<div class="value-split"><div class="value-cell"><b class="green num">${state.dataState==='stale'?'—':diffText()}</b><small>Diferencia<br>vs. mercado</small></div><div class="value-cell"><b class="gold">${ic('shield')}</b><small>Valor económico<br><strong>No confirmado</strong></small></div></div><p class="subnote mt" style="margin-top:13px">Más probabilidad no significa una mejor cuota.</p></article><article class="card goldedge verdict-card">${cardhead('Veredicto AA','',`<button class="textbtn gold" ${act('watch-add')} aria-label="Guardar análisis">${ic('star')}</button>`)}<div class="flex"><span class="verdict-icon">${ic('star')}</span><div><span class="verdict-lead">Milwaukee, favorito del modelo</span><div class="small muted">Lectura del escenario de demostración</div></div></div><p class="verdict-text">AA estima <strong class="green">64.6%</strong> para MIL. La diferencia frente al mercado es pequeña: <strong>${state.dataState==='stale'?'no vigente':diffText()}</strong>. Revisa el precio y el enfrentamiento antes de sacar conclusiones.</p><button class="textbtn mt8" ${act('methodology')}>Ver cómo interpretarlo ${ic('arrow')}</button></article></div>
<div class="row-3">${pitcherCard('CIN')}${pitcherCard('MIL')}${h2hCard()}</div>
<div class="chart-row"><article class="card"><div class="mini-tabs">${['Tendencias','Últimos partidos','H2H','Ofensiva','Bullpen','Clima y parque'].map(t=>`<button class="${state.trend===t?'active':''}" ${act('trend',`data-trend="${t}"`)}>${t}</button>`).join('')}</div>${trendContent()}</article>${miniMarkets()}</div>
<div class="bottom-row"><article class="card">${cardhead('Dobles por equipo','',`<button class="tooltip-btn" ${act('offenseinfo')} aria-label="Definición de dobles">${ic('info')}</button>`)}${[['CIN','1.7','20/30'],['MIL','2.1','23/30']].map(([t,n,f])=>`<div class="off-row">${logo(t)}<div><b class="num">${n}</b><small>Dobles por partido</small></div><div style="margin-left:auto"><b class="num">${f}</b><small>Juegos con 1+ doble</small></div></div>`).join('')}${btn('Explorar ofensiva','route','outline-blue full','arrow','data-to="equipos"')}<p class="subnote mt8">Últimos 30 partidos · muestra ficticia</p></article><article class="card">${cardhead('Bateadores vs. pitcher','',teamSwitcher())}${battingTable(true)}${btn('Ver enfrentamientos completos','route','outline-blue full','','data-to="bateadores"')}</article><article class="card next-card">${cardhead('Tu lista de revisión','')}<div class="checklist">${[['lineup','Revisar la alineación confirmada'],['pitcher','Comparar el abridor y los bateadores'],['price','Comparar precio y probabilidad'],['sample','Comprobar el tamaño de la muestra']].map(([k,t])=>`<label><input type="checkbox" data-check="${k}" ${state.checklist[k]?'checked':''}>${t}</label>`).join('')}</div>${btn(state.favorites.includes('cin-mil')?'En Mis picks':'Agregar a Mis picks','watch-add','greenbtn full','star')}<p class="subnote mt8">Solo seguimiento local. No se coloca ninguna apuesta.</p></article></div><div class="overview-footnote"><span>Todos los registros, retratos y valores son ilustrativos. No son pronósticos para el partido real.</span><button class="textbtn" ${act('sources')}>Ver estado y procedencia ${ic('arrow')}</button></div>`}
function trendContent(){if(state.trend==='Tendencias')return`<div class="chart-layout"><div><h3>Probabilidad a lo largo del día</h3><div class="legend"><span><i></i>AA · MIL</span><span><i class="market"></i>Mercado · MIL</span>${chip('DEMO')}</div>${lineChart()}</div><div><h3>Las claves del encuentro</h3><ul class="trends"><li>${ic('bolt')}<span><strong class="text">Brewers</strong>: cinco victorias en la secuencia de ejemplo.</span></li><li>${ic('ball')}<span>Peralta: compara su historial contra CIN con la alineación de hoy.</span></li><li>${ic('users')}<span>El historial directo tiene <strong>muestras pequeñas</strong>; no basta para pronosticar.</span></li><li>${ic('shield')}<span>Una diferencia de ${diffText()} no confirma valor económico.</span></li></ul></div></div>`;if(state.trend==='Clima y parque')return parkContent();if(state.trend==='Últimos partidos'||state.trend==='H2H')return recentTable(state.trend==='H2H');return teamComparison(state.trend==='Bullpen'?'bullpen':'offense')}
function recentTable(h2h=false){const records=h2h?[['10 sep','CIN','MIL',3,5],['9 sep','MIL','CIN',4,2],['8 sep','CIN','MIL',2,1],['7 sep','MIL','CIN',5,6],['6 sep','CIN','MIL',1,4]]:[['12 sep','MIL','CHC',5,2],['11 sep','MIL','CHC',4,3],['10 sep','MIL','CIN',5,3],['9 sep','CIN','STL',2,6],['8 sep','CIN','STL',1,4]];return`<div class="tablewrap"><table class="data-table"><thead><tr><th>Fecha · demo</th><th>Equipo</th><th>Rival</th><th>Resultado</th><th>Total</th></tr></thead><tbody>${records.map(([d,t,o,a,b])=>`<tr><td>${d}</td><td>${t}</td><td>${o}</td><td>${a} – ${b}</td><td>${a+b}</td></tr>`).join('')}</tbody></table></div><p class="subnote mt8">Serie inventada para probar el diseño. No representa resultados reales.</p>`}
function teamComparison(kind='all'){const rows=kind==='bullpen'?[['ERA bullpen',4.52,3.34],['WHIP bullpen',1.40,1.17],['K / 9',8.2,9.1]]:[['Carreras / juego',4.1,5.2],['Carreras permitidas',4.8,3.9],['Dobles / juego',1.7,2.1],['OPS',.704,.759],['OBP',.309,.338]];return rows.map(([n,a,b])=>`<div class="team-statline"><div><b class="num">${a}</b><div class="pairedbar"><i style="width:${a/(a+b)*100}%"></i></div></div><span class="muted center">${n}</span><div><b class="num">${b}</b><div class="pairedbar home"><i style="width:${b/(a+b)*100}%"></i></div></div></div>`).join('')}
function lineup(team){if(state.dataState==='pending')return`<div class="empty">${ic('users')}<h3>Alineación no publicada</h3><p>No mostramos una alineación probable como confirmada. El contexto individual aparecerá al recibirla.</p></div>`;return`<p class="subnote">Alineación ilustrativa, no confirmada</p>${batters.filter(b=>b.team===team).map(b=>`<div class="roster-row"><span class="order">${b.order}</span><button class="playercell" style="text-align:left" ${act('batter-detail',`data-id="${b.id}"`)}>${b.name}</button><span class="dim">${b.pos}</span><span class="blue num">${b.avg==null?'—':b.avg.toFixed(3)}</span></div>`).join('')}`}
function teamsView(){const metrics={Dobles:[['1+ doble','20/30','66.7%','23/30','76.7%'],['2+ dobles','12/30','40.0%','16/30','53.3%'],['Dobles por partido','1.7','Promedio','2.1','Promedio']],Hits:[['8+ hits','17/30','56.7%','20/30','66.7%'],['10+ hits','10/30','33.3%','15/30','50.0%']],Bases:[['12+ bases totales','14/30','46.7%','18/30','60.0%'],['16+ bases totales','9/30','30.0%','12/30','40.0%']],Embasadas:[['10+ embasadas','16/30','53.3%','21/30','70.0%'],['14+ embasadas','8/30','26.7%','12/30','40.0%']]};return`${heading('Dos equipos. Un enfrentamiento.','Compara la forma, la producción ofensiva y las alineaciones; sin confundir historial con probabilidad de hoy.',btn('Ver posiciones','route','outline-blue','list','data-to="posiciones"'))}<div class="two-col"><article class="card"><div class="flex between">${['CIN','MIL'].map(t=>`<div class="flex">${logo(t)}<h3>${teams[t].nick}</h3></div>`).join('')}</div>${teamComparison()}${sourceNote()}</article><article class="card">${cardhead('Producción ofensiva','chart',btn('Definiciones','offenseinfo','','info'))}<div class="filters">${Object.keys(metrics).map(m=>`<button class="filter ${state.formMetric===m?'active':''}" ${act('offense',`data-metric="${m}"`)}>${m}</button>`).join('')}</div><div class="tablewrap mt8"><table class="data-table"><thead><tr><th>Últimos 30 · demo</th><th>CIN</th><th>MIL</th></tr></thead><tbody>${metrics[state.formMetric].map(([n,a,ap,b,bp])=>`<tr><td>${n}</td><td><b>${a}</b><br><small class="dim">${ap}</small></td><td><b class="gold">${b}</b><br><small class="dim">${bp}</small></td></tr>`).join('')}</tbody></table></div><div class="notice">${state.formMetric==='Dobles'?'Un doble es un hit de dos bases, no dos hits ni dos veces embasado.':state.formMetric==='Bases'?'Bases totales = 1B + 2×2B + 3×3B + 4×HR. No incluye bases por bolas.':state.formMetric==='Embasadas'?'Definición en esta demostración: hits + bases por bolas + pelotazos.':'Frecuencias descriptivas del escenario. No son probabilidades estimadas.'}</div>${btn('Ver jugadores individuales','route','outline-blue full','arrow','data-to="jugadores"')}</article></div><div class="two-col mt">${['CIN','MIL'].map(t=>`<article class="card">${cardhead(`${teams[t].nick} · alineación`,'users',chip('DEMO','goldchip'))}${lineup(t)}</article>`).join('')}</div><article class="card mt">${cardhead('Enfrentamientos anteriores','games')}${recentTable(true)}</article>`}
function pitchersView(){const a=periodVs(state.pitcher),t=teams[state.pitcher];return`${heading('El duelo empieza en el montículo.','Rendimiento del abridor ante el rival y ante los bateadores; siempre con período, conteo y denominador.',btn('Bateadores vs pitcher','route','outline-blue','arrow','data-to="bateadores"'))}<div class="two-col">${pitcherCard('CIN')}${pitcherCard('MIL')}</div><div class="two-one mt">${h2hCard()}<article class="card">${cardhead('Dos porcentajes distintos','info')}<div class="metric-big green num">${pct(a.w,a.w+a.l)}</div><p class="small muted">Victorias del pitcher: ${a.w} / ${a.w+a.l} decisiones.</p><div class="line-divider"></div><div class="metric-big gold num">${pct(a.teamWins,a.starts)}</div><p class="small muted">Victorias del equipo: ${a.teamWins} / ${a.starts} aperturas.</p><p class="subnote mt8">${a.nd} actuaciones sin decisión no son derrotas del pitcher.</p></article></div><div class="two-col mt"><article class="card">${cardhead('Perfil contra la alineación','users')}${battingTable(true,state.pitcher==='MIL'?'CIN':'MIL')}${sourceNote('Historial sintético de la alineación de ejemplo')}</article><article class="card">${cardhead('Qué aporta cada dato','shield')}<div class="status-steps">${[['Mano de lanzamiento',`${t.pitcher}: ${t.hand.toLowerCase()}. Compara splits del bateador ante zurdos o derechos.`],['Muestra de enfrentamientos','Pocas apariciones no bastan para identificar una ventaja estable.'],['Alineación y cambio de abridor','Un abridor reemplazado invalida el contexto anterior. Se necesita confirmación desde la fuente.'],['Antes del partido','La versión real debe excluir resultados posteriores al comienzo del encuentro.']].map(([h,s],i)=>`<div class="status-step"><span class="stepnum">${i+1}</span><div><strong>${h}</strong><p>${s}</p></div></div>`).join('')}</div></article></div>`}
function battersView(){return`${heading('Cada bateador, frente a su pitcher.','Explora los enfrentamientos directos sin perder de vista la muestra. Toca un jugador para ver las fórmulas y sus conteos.',teamSwitcher())}<div class="filter-row"><input class="input" id="batter-filter" type="search" data-input="batterQuery" value="${esc(state.batterQuery)}" placeholder="Filtrar bateador…" aria-label="Filtrar bateador"><span class="chip goldchip">ALINEACIÓN DE EJEMPLO</span><select class="select" data-change="batterSort" aria-label="Ordenar bateadores"><option value="order" ${state.batterSort==='order'?'selected':''}>Orden al bate</option><option value="avg" ${state.batterSort==='avg'?'selected':''}>Mayor AVG</option><option value="k" ${state.batterSort==='k'?'selected':''}>Mayor K%</option></select></div><div class="card">${cardhead(`${teams[state.team].nick} vs. ${teams[state.team==='MIL'?'CIN':'MIL'].pitcher}`,'ball')}<div id="batter-table">${state.dataState==='pending'?lineup(state.team):battingTable()}</div>${sourceNote('Ejemplo de últimos tres años · datos no conectados')}</div><div class="three-col mt"><article class="card"><div class="method-icon">${ic('ball')}</div><h3>AVG no usa todas las apariciones</h3><p class="small muted mt8">AVG = hits / turnos oficiales al bate. Las bases por bolas no cuentan como turnos.</p></article><article class="card"><div class="method-icon">${ic('users')}</div><h3>OBP y K% tienen otra base</h3><p class="small muted mt8">OBP usa hits, bases por bolas y pelotazos. K% divide los ponches entre las apariciones al plato.</p></article><article class="card"><div class="method-icon">${ic('shield')}</div><h3>Sin historial no es 0%</h3><p class="small muted mt8">El guion indica que no existen enfrentamientos en la muestra demo. No es una probabilidad de cero.</p></article></div>`}
function poisson(lambda,k){let p=Math.exp(-lambda);for(let i=1;i<=k;i++)p*=lambda/i;return p}
function totalStats(){let under=0,push=0;for(let k=0;k<90;k++){const p=poisson(8.7,k);if(k<state.line)under+=p;else if(k===state.line)push+=p}return{under,push,over:Math.max(0,1-under-push)}}
function totalResults(){const q=totalStats();return`<div class="three-col"><div><span class="eyebrow">Alta de ${state.line}</span><div class="metric-big green num">${pct(q.over,1)}</div></div><div><span class="eyebrow">Baja de ${state.line}</span><div class="metric-big blue num">${pct(q.under,1)}</div></div><div><span class="eyebrow">Empate de línea</span><div class="metric-big num">${pct(q.push,1)}</div></div></div><p class="subnote">Ejemplo matemático Poisson (media 8.7), no modelo aprobado ni pronóstico real.</p>`}
function totalView(){const distribution=Array.from({length:15},(_,k)=>poisson(8.7,k));return`${heading('El partido, carrera por carrera.','Una vista útil de totales: distribución ilustrativa, histórico y contexto. La publicación predictiva sigue separada de las estadísticas.',btn('Metodología','totalinfo','','info'))}<div class="two-one"><article class="card">${cardhead('Explorador de línea','chart',chip('SIMULADOR DIDÁCTICO','goldchip'))}<div class="line-control"><div class="flex between"><label for="total-line" class="muted small">Total de carreras</label><output id="line-output" for="total-line" class="num">${state.line.toFixed(1)}</output></div><input id="total-line" type="range" min="5.5" max="13.5" step="0.5" value="${state.line}" data-input="totalLine"><div class="flex between small dim"><span>5.5</span><span>Mueve la línea para explorar</span><span>13.5</span></div></div><div class="mt" id="total-result">${totalResults()}</div><div class="bar-chart" role="img" aria-label="Distribución ilustrativa de carreras Poisson">${distribution.map((v,k)=>`<div class="baritem ${k>state.line?'goldbar':''}" style="height:${v/Math.max(...distribution)*100}%" data-tooltip="${k} carreras: ${pct(v,1)}"><span>${k}</span></div>`).join('')}</div>${sourceNote('Cálculo local con parámetros ficticios')}</article><div class="stack"><article class="card">${cardhead('Contexto ofensivo','ball')}<div class="candidate"><span class="flex">${logo('CIN')}Reds</span><strong class="num">4.1 C/J</strong></div><div class="candidate"><span class="flex">${logo('MIL')}Brewers</span><strong class="num">5.2 C/J</strong></div><p class="subnote mt8">Promedios de ejemplo, no insumos conectados al simulador didáctico.</p></article><article class="card">${cardhead('Estado de la predicción','shield')}<div class="status-card">${ic('lock')}<div><strong>No conectada a un modelo validado</strong>La gráfica prueba la interacción. No se modificó el control de publicación de la app real.</div></div><button class="textbtn mt" ${act('validation','data-market="Total"')}>Qué falta para publicar ${ic('arrow')}</button></article></div></div><article class="card mt">${cardhead('Histórico de carreras del enfrentamiento','games')}${recentTable(true)}</article>`}
const propTypes={hits1:{name:'1+ hit',description:'Partidos con al menos un hit',test:g=>g.hits>=1},hits2:{name:'2+ hits',description:'Partidos con dos o más hits',test:g=>g.hits>=2},doubles:{name:'1+ doble',description:'Partidos con al menos un doble',test:g=>g.doubles>=1},tb:{name:'2+ bases totales',description:'Bases producidas únicamente mediante hits',test:g=>g.tb>=2},ob:{name:'2+ veces embasado',description:'En esta demo: H + BB + HBP',test:g=>g.ob>=2}};
function propCards(){const kind=propTypes[state.prop];return batters.filter(b=>b.team===state.propsTeam).slice(0,6).map(b=>{const n=b.games.filter(kind.test).length,id=`prop:${b.id}:${state.prop}`,isAdded=state.combo.some(x=>x.id===id);return`<article class="card prop-card"><div class="flex"><span class="player-avatar">${b.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><div><h3>${b.name}</h3><span class="small muted">${b.team} · ${b.pos}</span></div></div><div class="flex between"><strong>${kind.name}</strong>${chip('HISTÓRICO DEMO')}</div><div><span class="prop-value green num">${pct(n,30,0)}</span><span class="small muted"> de los partidos</span><p class="prop-sub">${n} / 30 partidos · frecuencia observada de ejemplo</p></div><div class="prop-range" aria-label="Últimos 10 ejemplos">${b.games.slice(-10).map(g=>`<i class="${kind.test(g)?'yes':''}"></i>`).join('')}</div><div class="flex between"><button class="textbtn" ${act('batter-detail',`data-id="${b.id}"`)}>Ver historial ${ic('arrow')}</button><span class="small dim">No es pronóstico</span></div>${btn(isAdded?'En la combinación':'Comparar en combo','add-prop',isAdded?'selected full':'outline-blue full',isAdded?'check':'plus',`data-id="${b.id}"`)}</article>`}).join('')}
function playersView(){return`${heading('Una ficha para cada oportunidad.','Hits, dobles, bases y embasadas no son lo mismo. Cambia el indicador y compara frecuencias con su muestra, no probabilidades inventadas.',teamSwitcher('props-team',state.propsTeam))}<div class="filter-row"><div class="filters">${Object.entries(propTypes).map(([k,v])=>`<button class="filter ${state.prop===k?'active':''}" ${act('prop',`data-prop="${k}"`)}>${v.name}</button>`).join('')}</div><button class="textbtn" ${act('offenseinfo')}>Definiciones ${ic('info')}</button></div><p class="subnote" style="margin-bottom:16px">${propTypes[state.prop].description} · Históricos ficticios de 30 partidos · Jugadores ilustrativos</p><div class="three-col propsgrid">${state.dataState==='pending'?`<div class="empty">${ic('users')}<h3>Alineación pendiente</h3><p>No asignamos selecciones a jugadores sin confirmar. Puedes explorar el resto de la demo.</p></div>`:propCards()}</div><div class="status-card mt">${ic('shield')}<div><strong>Estadísticas descriptivas disponibles en la demo</strong>Los pronósticos por jugador requieren modelos y validación específicos. Agregar una ficha al comparador no la aprueba ni coloca una apuesta.</div></div>`}
function comboCandidates(){return[{id:'winner',title:'Milwaukee · ganador',sub:'Probabilidad ilustrativa: 64.6% · CIN–MIL',market:'Ganador'},{id:'total',title:'Alta de 8.5 carreras',sub:'Línea de ejemplo · sin predicción pública',market:'Total'},{id:'doubles-team',title:'Brewers · 1+ doble del equipo',sub:'Frecuencia demo: 23/30 · no es pronóstico',market:'Ofensiva'}]}
function combosView(){return`${heading('Combina contexto. No falsas certezas.','Construye una comparación de hasta tres selecciones. Esta vista nunca confunde multiplicar porcentajes con validar una combinación.',btn('Ver guardados','route','','star','data-to="guardados"'))}<div class="two-one"><article class="card">${cardhead('Selecciones para comparar','layers',chip(`${state.combo.length} / 3`))}${state.combo.length?state.combo.map((x,i)=>`<div class="combo-leg"><span class="chip bluechip">${i+1}</span><div class="grow"><strong>${esc(x.title)}</strong><small>${esc(x.sub)}</small></div><button class="iconbtn" ${act('remove-leg',`data-id="${esc(x.id)}"`)} aria-label="Quitar ${esc(x.title)}">${ic('close')}</button></div>`).join(''):`<div class="empty">${ic('layers')}<h3>Tu comparación empieza aquí</h3><p>Añade una selección de la lista o desde Jugadores. No se coloca ninguna apuesta.</p></div>`}<div class="line-divider"></div><h3>Añadir una selección</h3>${comboCandidates().map(x=>`<div class="candidate"><div><strong>${x.title}</strong><small>${x.sub}</small></div>${btn(state.combo.some(a=>a.id===x.id)?'Añadida':'Añadir','add-leg',state.combo.some(a=>a.id===x.id)?'selected':'outline-blue',state.combo.some(a=>a.id===x.id)?'check':'plus',`data-id="${x.id}"`)}</div>`).join('')}<button class="textbtn mt" ${act('route','data-to="jugadores"')}>Explorar selecciones de jugadores ${ic('arrow')}</button></article><article class="card">${cardhead('Lectura de la combinación','shield')}<div class="metric-big num">—</div><span class="small muted">Probabilidad conjunta no calculada</span><div class="notice">${state.combo.length>1?'Las selecciones pertenecen al mismo partido y pueden estar correlacionadas. No multiplicamos sus probabilidades.':'Añade al menos dos selecciones para revisar sus dependencias.'}</div><div class="status-steps"><div class="status-step"><span class="stepnum">1</span><div><strong>Elegibilidad individual</strong><p>Estas selecciones son de demostración. No se declaran públicamente aprobadas.</p></div></div><div class="status-step"><span class="stepnum">2</span><div><strong>Dependencia entre resultados</strong><p>Hits, bases y carreras del mismo juego pueden compartir causas.</p></div></div><div class="status-step"><span class="stepnum">3</span><div><strong>Seguimiento, no apuesta</strong><p>La combinación se guarda únicamente en este navegador.</p></div></div></div><div class="mt">${btn('Guardar comparación','save-combo','greenbtn full','star')}</div>${state.combo.length?`<button class="textbtn mt8" ${act('clear-combo')}>Vaciar comparación</button>`:''}</article></div>`}
function simulationResults(){if(!state.sim)return`<div class="empty">${ic('flask')}<h3>Explora la variabilidad</h3><p>La simulación ejecuta ensayos binomiales con una probabilidad ficticia fija de 64.6%. No entrena ni valida el modelo.</p></div>`;const s=state.sim;return`<div class="sim-result"><span class="eyebrow">Milwaukee · victorias simuladas</span><div class="metric-big num">${pct(s.w,s.n,2)}</div><span class="small muted">${s.w.toLocaleString('es')} / ${s.n.toLocaleString('es')} ensayos</span><div class="sim-comparison"><span style="width:${100-s.w/s.n*100}%">CIN ${pct(s.n-s.w,s.n,1)}</span><span style="width:${s.w/s.n*100}%">MIL ${pct(s.w,s.n,1)}</span></div><p class="subnote">Cada ensayo utiliza p = 0.646 y un generador seudoaleatorio con semilla ${s.seed}.</p></div><div class="three-col mt"><div class="card"><span class="eyebrow">Probabilidad de entrada</span><div class="metric-big num">64.6%</div><small class="muted">Ficticia y constante</small></div><div class="card"><span class="eyebrow">Victorias CIN</span><div class="metric-big num">${(s.n-s.w).toLocaleString('es')}</div><small class="muted">No incluye empates</small></div><div class="card"><span class="eyebrow">Error Monte Carlo aprox.</span><div class="metric-big num">±${(1.96*Math.sqrt(.646*.354/s.n)*100).toFixed(2)} pp</div><small class="muted">No mide el error del modelo</small></div></div>`}
function simulationView(){return`${heading('La probabilidad no elimina el azar.','Ejecuta una simulación local para ver cómo varían los resultados. Es una herramienta didáctica, no evidencia predictiva.',btn('Cómo funciona','siminfo','','info'))}<div class="card"><div class="filter-row"><label for="sim-n" class="small muted">Número de ensayos</label><select id="sim-n" class="select" data-change="simN" style="margin-left:0"><option value="1000" ${state.simN===1000?'selected':''}>1.000</option><option value="10000" ${state.simN===10000?'selected':''}>10.000</option><option value="50000" ${state.simN===50000?'selected':''}>50.000</option></select><button class="btn bluebtn" ${act('run-sim')} ${state.simBusy?'disabled':''}>${ic('flask')}${state.simBusy?'Ejecutando…':'Ejecutar simulación'}</button><button class="btn" ${act('export-sim')} ${!state.sim?'disabled':''}>${ic('download')}Exportar resultado</button></div><div id="sim-results">${simulationResults()}</div></div><div class="notice">Una simulación de una probabilidad existente no demuestra que esa probabilidad sea correcta. No se presenta ROI ni una promesa de ganancias.</div>`}
function marketsView(){return`${heading('La cuota cambia la lectura.','Compara líneas ficticias, su probabilidad implícita y el margen. Los operadores A, B y C son ejemplos, no ofertas comerciales.',btn('Formato: '+(state.format==='american'?'Americano':'Decimal'),'odds-format','','refresh'))}<div class="two-one"><article class="card">${cardhead('Comparador de líneas','market',chip('SIN DATOS EN VIVO','goldchip'))}<div class="filters">${Object.entries(books).map(([k,b])=>`<button class="filter ${state.book===k?'active':''}" ${act('book',`data-book="${k}"`)}>${b.name}</button>`).join('')}</div><div class="tablewrap mt"><table class="data-table"><thead><tr><th>Mercado</th><th>CIN / Alta</th><th>MIL / Baja</th><th>Origen</th></tr></thead><tbody><tr><td>Ganador</td><td>${state.dataState==='stale'?'—':formatOdds(books[state.book].away)}</td><td class="gold">${state.dataState==='stale'?'—':formatOdds(books[state.book].home)}</td><td>Demo</td></tr><tr><td>Total · 8.5</td><td>${state.dataState==='stale'?'—':formatOdds(books[state.book].over)}</td><td>${state.dataState==='stale'?'—':formatOdds(books[state.book].under)}</td><td>Demo</td></tr><tr><td>Jugadores</td><td colspan="2">Sin fuente de cuotas conectada</td><td>—</td></tr></tbody></table></div>${sourceNote('Sin vínculos a operadores ni transacciones')}<div class="mt"><h3>Comparación entre proveedores ficticios</h3><div class="tablewrap mt8"><table class="data-table"><thead><tr><th>Proveedor</th><th>CIN</th><th>MIL</th><th>MIL sin margen</th></tr></thead><tbody>${Object.values(books).map(b=>`<tr><td>${b.name}</td><td>${state.dataState==='stale'?'—':formatOdds(b.away)}</td><td>${state.dataState==='stale'?'—':formatOdds(b.home)}</td><td>${state.dataState==='stale'?'—':pct(implied(b.home),implied(b.home)+implied(b.away))}</td></tr>`).join('')}</tbody></table></div></div></article><div class="stack">${probabilityCard()}<article class="card">${cardhead('Precio e interpretación','info')}<p class="small muted">La probabilidad implícita incluye el margen. La comparación del modelo utiliza una normalización de ambos lados, no el porcentaje bruto de una sola cuota.</p><button class="textbtn mt" ${act('route','data-to="herramientas"')}>Abrir calculadora ${ic('arrow')}</button></article></div></div>`}

function brainView(){return`${heading('Cerebro AA. Evidencia antes que etiquetas.','Diseño del panel de validación. Ninguno de estos controles autoriza modelos ni modifica los estados del sistema publicado.',btn('Metodología','methodology','','book'))}<div class="three-col"><article class="card">${cardhead('Productor','refresh')}${chip('NO CONECTADO','goldchip')}<p class="small muted mt">La última ejecución exitosa debe provenir del productor, no inferirse de la edad de una predicción.</p></article><article class="card">${cardhead('Predicciones','chart')}${chip('DEMO LOCAL')}<p class="small muted mt">Las muestras reales y sus fechas no están conectadas a este prototipo.</p></article><article class="card">${cardhead('Publicación','lock')}${chip('SIN CAMBIOS','goldchip')}<p class="small muted mt">No se ha abierto ningún mercado Total, Jugadores o Combos en producción.</p></article></div><div class="two-col mt"><article class="card">${cardhead('Camino de validación','shield')}<div class="status-steps">${[['Datos y trazabilidad','Líneas capturadas antes del partido, resultados completos y definiciones verificables.'],['Evaluación temporal','Entrenamiento separado del futuro; muestras no reutilizadas como evidencia forward.'],['Calibración y referencia','Probabilidades contrastadas con resultados y con una referencia comparable.'],['Aprobación explícita','Una muestra mínima no abre el mercado automáticamente.']].map(([a,b],i)=>`<div class="status-step"><span class="stepnum">${i+1}</span><div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}</div></article><article class="card">${cardhead('Estado por mercado','layers')}${['Ganador','Total','Jugadores','Combos'].map(m=>`<div class="candidate"><strong>${m}</strong><button class="textbtn" ${act('validation',`data-market="${m}"`)}>Ver requisitos ${ic('chevron')}</button></div>`).join('')}</article></div>`}
function educationView(){const entries=[['Porcentaje histórico vs. probabilidad','Una frecuencia histórica describe los partidos incluidos en una muestra. No es, por sí sola, un pronóstico calibrado para el siguiente encuentro.'],['Victorias del pitcher vs. victorias del equipo','El récord del pitcher usa victorias y derrotas acreditadas. El equipo puede ganar un partido en el que su abridor terminó sin decisión.'],['Hits, dobles, bases y embasadas','Un doble cuenta como un hit y produce dos bases totales. Dos hits simples también producen dos bases totales. Una base por bolas no añade bases totales.'],['Qué significa una diferencia de +0.2 pp','Es una diferencia entre dos probabilidades. El rendimiento económico depende del precio y de si la estimación es suficientemente fiable.'],['Por qué no multiplicamos automáticamente un combo','Cuando dos selecciones dependen del mismo juego o jugador, no hay base para asumir que sus resultados son independientes.'],['Cómo leer una muestra pequeña','Un 75% obtenido en cuatro partidos no tiene el mismo respaldo que un 75% en cientos. Muestra, fechas y sesgos importan.']];return`${heading('Entiende lo que estás viendo.','Explicaciones breves junto a los indicadores. El diseño reduce avisos repetidos, no la transparencia.')}<div class="two-one"><div class="accordions">${entries.map(([q,a],i)=>`<details ${i===0?'open':''}><summary>${q}</summary><p>${a}</p></details>`).join('')}</div><article class="card goldedge">${cardhead('Datos con contexto','book')}<p class="muted small">AA Sports es una herramienta informativa. Este prototipo no acepta dinero, no coloca apuestas y no ofrece garantías de resultados.</p><div class="mt">${btn('Explorar calculadora','route','outline-blue full','arrow','data-to="herramientas"')}</div></article></div>`}
function calcOutput(){const a=Number(state.calcPrice),p=Number(state.calcProbability)/100;if(!Number.isFinite(a)||Math.abs(a)<100||!Number.isFinite(p)||p<=0||p>=1)return`<p class="field-error" role="alert">Introduce una cuota americana de valor absoluto ≥ 100 y una probabilidad entre 0 y 100, sin incluir extremos.</p>`;const d=a>0?1+a/100:1+100/Math.abs(a),ev=p*d-1;return`<div class="three-col"><div><span class="eyebrow">Cuota decimal</span><div class="metric-big num">${d.toFixed(3)}</div></div><div><span class="eyebrow">Prob. implícita</span><div class="metric-big num">${pct(implied(a),1)}</div></div><div><span class="eyebrow">EV teórico / unidad</span><div class="metric-big num ${ev>=0?'green':'red'}">${ev>=0?'+':''}${ev.toFixed(3)}</div></div></div><p class="subnote">EV = p × cuota decimal − 1. Solo aritmética con los valores introducidos; no verifica p ni recomienda apostar.</p>`}
function toolsView(){return`${heading('Herramientas para contrastar, no adivinar.','Calculadoras locales y exportación del escenario de ejemplo. No usan información financiera personal ni ejecutan transacciones.')}<div class="two-one"><article class="card">${cardhead('Precio, probabilidad y valor teórico','tools')}<div class="calc-row"><label><span class="tool-label">Cuota americana</span><input class="input" type="number" data-input="calcPrice" value="${state.calcPrice}" aria-label="Cuota americana"></label><label><span class="tool-label">Probabilidad hipotética (%)</span><input class="input" type="number" min="0.1" max="99.9" step="0.1" data-input="calcProbability" value="${state.calcProbability}" aria-label="Probabilidad hipotética"></label></div><div class="line-divider"></div><div id="calc-output">${calcOutput()}</div></article><div class="stack"><article class="card">${cardhead('Documentar la lectura','download')}<p class="small muted">Exporta el resumen de la demo o tu seguimiento local para evaluar el flujo.</p><div class="stack mt">${btn('Descargar resumen','export-summary','outline-blue full','download')}${btn('Exportar guardados','export-saved','outline-blue full','download')}</div></article><article class="card">${cardhead('Probar estados de interfaz','eye')}<p class="small muted">Revisa cómo se verá la aplicación cuando falte información o la fuente no responda.</p><div class="mt">${btn('Abrir estados','states','outline-blue full','arrow')}</div></article></div></div>`}

let toastTimer;

function closeModal(){const m=$('#modal');if(m.open)m.close()}
function openModal(title,body){const m=$('#modal');m.innerHTML=`<div class="modalhead"><h2 id="modal-title">${title}</h2><button class="iconbtn" ${act('close-modal')} aria-label="Cerrar diálogo">${ic('close')}</button></div><div class="modalbody">${body}</div>`;if(!m.open)m.showModal()}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Archivo de demostración preparado.')}

async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Texto copiado.')}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'Texto copiado.':'No se pudo copiar; selecciona el texto o descárgalo.')}}
function methodology(){openModal('Cómo leer AA Sports',`<p><strong>Esta entrega es un prototipo interactivo, no una fuente deportiva actualizada.</strong> Reproduce la dirección visual aprobada y permite evaluar los flujos de uso.</p><div class="accordions"><details open><summary>Una probabilidad no es una garantía</summary><p>64.6% es la cifra de ejemplo del diseño. No es una recomendación para un partido real ni implica valor económico.</p></details><details><summary>Historial separado del pronóstico</summary><p>Se muestran conteos y denominadores. Las frecuencias ficticias no se convierten automáticamente en probabilidades para hoy.</p></details><details><summary>Estadísticas útiles antes de aprobar modelos</summary><p>Total, Jugadores y Combos tienen vistas completas. Sus ejemplos no cambian ningún gate ni autorizan pronósticos en la aplicación publicada.</p></details><details><summary>Simulación y cálculos locales</summary><p>El simulador binomial parte de p=0.646. Totales usa una distribución Poisson didáctica de media 8.7. Ninguno entrena o valida el motor AA.</p></details></div>${btn('Revisar datos y conexiones','sources','outline-blue full','arrow')}`)}

function offenseInfo(){openModal('Cuatro indicadores, cuatro significados',`<div class="accordions"><details open><summary>1+ doble</summary><p>Un hit con el que el bateador alcanza segunda base. Dos hits simples no son un doble.</p></details><details open><summary>2+ hits</summary><p>Dos o más hits en el partido. El tamaño de cada hit no modifica su conteo como un hit.</p></details><details open><summary>2+ bases totales</summary><p>Se calcula 1B + 2×2B + 3×3B + 4×HR. Una base por bolas no aporta bases totales.</p></details><details open><summary>2+ veces embasado</summary><p>Definición elegida para la demo: H + BB + HBP. No incluye errores ni elección del fildeador. La versión real debe usar una definición y unas reglas de liquidación explícitas.</p></details></div><p class="subnote">Las cuatro categorías permanecen separadas porque aún no se ha confirmado cuál era el mercado ofensivo que se quería priorizar.</p>`)}

function batterDetail(id){const b=batters.find(x=>x.id===id);if(!b)return;openModal(esc(b.name),`<div class="flex between wrap">${chip(b.team+' · '+b.pos)}${chip('HISTORIAL SINTÉTICO','goldchip')}</div><p class="muted small mt">Contra ${teams[b.team==='MIL'?'CIN':'MIL'].pitcher} · ejemplos de diseño. La muestra no es evidencia actual del jugador.</p>${b.pa?`<div class="three-col mt"><div class="card"><span class="eyebrow">Hits / turnos</span><div class="metric-big num">${b.h}/${b.ab}</div><small class="muted">AVG ${(b.avg*100).toFixed(1)}%</small></div><div class="card"><span class="eyebrow">Ponches / PA</span><div class="metric-big num">${b.k}/${b.pa}</div><small class="muted">K% ${pct(b.k,b.pa)}</small></div><div class="card"><span class="eyebrow">Embasado</span><div class="metric-big num">${pct(b.h+b.bb+b.hbp,b.ab+b.bb+b.hbp+b.sf)}</div><small class="muted">OBP de ejemplo</small></div></div><div class="tablewrap mt"><table class="data-table"><thead><tr><th>Medida</th><th>Conteo / denominador</th><th>Resultado</th></tr></thead><tbody><tr><td>Dobles / PA</td><td>${b.doubles} / ${b.pa}</td><td>${pct(b.doubles,b.pa)}</td></tr><tr><td>BB / PA</td><td>${b.bb} / ${b.pa}</td><td>${pct(b.bb,b.pa)}</td></tr><tr><td>HR / PA</td><td>${b.hr} / ${b.pa}</td><td>${pct(b.hr,b.pa)}</td></tr><tr><td>OBP</td><td>(${b.h} + ${b.bb} + ${b.hbp}) / (${b.ab} + ${b.bb} + ${b.hbp} + ${b.sf})</td><td>${b.obp.toFixed(3)}</td></tr></tbody></table></div><div class="notice">Muestra pequeña. Una frecuencia histórica no es la probabilidad de que este resultado ocurra hoy.</div>`:`<div class="empty mt">${ic('users')}<h3>Sin enfrentamientos en el fixture</h3><p>Se muestran guiones, no porcentajes de cero. No se extrapola a la alineación completa.</p></div>`}<div class="modal-actions">${btn('Ver producción por partido','batter-props','bluebtn','arrow',`data-team="${b.team}"`)}</div>`)}

function updateSearch(q){const options=[{type:'route',id:'resumen',name:'Cincinnati Reds vs Milwaukee Brewers',sub:'Partido principal de demostración',icon:'ball'},...mainTabs.map(([r,n])=>({type:'route',id:r,name:n,sub:'Sección del partido',icon:'chart'})),...sideNav.map(([r,n,i])=>({type:'route',id:r,name:n,sub:'Navegación',icon:i})),...batters.map(b=>({type:'batter-detail',id:b.id,name:b.name,sub:b.team+' · bateador de ejemplo',icon:'users'}))];const used=new Set();const matches=options.filter(o=>{const k=o.type+o.id;if(used.has(k))return false;used.add(k);return(o.name+' '+o.sub).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))}).slice(0,10);$('#search-results').innerHTML=matches.map(o=>`<button class="search-result" ${act(o.type,o.type==='route'?`data-to="${o.id}"`:`data-id="${o.id}"`)}>${ic(o.icon)}<span><strong>${o.name}</strong><small>${o.sub}</small></span>${ic('chevron')}</button>`).join('')||`<div class="empty"><h3>Sin coincidencias</h3><p>Busca “Brewers”, “dobles”, “pitchers” o un nombre de ejemplo.</p></div>`}
function favorite(id){if(state.favorites.includes(id)){state.favorites=state.favorites.filter(x=>x!==id);toast('Partido retirado del seguimiento local.')}else{state.favorites.push(id);toast('Partido guardado en este navegador.')}persist('saved',state.favorites);render()}
function addLeg(x){if(state.combo.some(c=>c.id===x.id)){toast('Esta selección ya está en la comparación.');return}if(state.combo.length>=3){toast('La comparación admite un máximo de tres selecciones.');return}state.combo.push(x);render();toast('Selección añadida al comparador, no a una apuesta.')}
function handleGame(id){if(id==='cin-mil'){navigate('resumen');return}const g=[...initialGames,...gamesForSport()].find(x=>x.id===id);if(!g){toast('Este partido no pertenece al fixture actual.');return}openModal(esc(g.awayName+' vs '+g.homeName),`<div class="flex between">${logo(g.away)}${chip('ENCUENTRO ILUSTRATIVO')}${logo(g.home)}</div><div class="sim-result mt"><span class="eyebrow">${esc(g.status)} · demo</span><div class="metric-big num">${g.score||g.time+' ET'}</div><p class="subnote">${g.score?'Marcador simulado, no resultado real.':'Horario ficticio para explorar la jornada.'}</p></div><div class="status-card mt">${ic('info')}<div><strong>Sin modelo o estadísticas individuales conectados</strong>El prototipo no traslada los datos de Reds–Brewers a otros partidos. El flujo detallado está implementado para el encuentro de referencia.</div></div><div class="modal-actions">${btn(state.favorites.includes(id)?'Quitar favorito':'Guardar partido','favorite','goldbtn','star',`data-id="${id}"`)}${btn('Ver demo completa MLB','route','bluebtn','arrow','data-to="resumen"')}</div>`)}
const actions={
'route':el=>navigate(el.dataset.to),'menu':menu,'theme':()=>{state.theme=state.theme==='dark'?'light':'dark';persist('theme',state.theme);render();toast('Tema '+(state.theme==='dark'?'oscuro':'claro')+' activado.')},'search':openSearch,'sources':sources,'methodology':methodology,'close-modal':closeModal,'sport':el=>{state.sport=el.dataset.sport;state.gameFilter='Todos';navigate('partidos')},'profile':()=>openModal('Tu espacio AA Sports',`<div class="flex"><span class="avatar" style="display:grid;place-items:center">A</span><div><h3>Perfil local de demostración</h3><small class="muted">Sin sesión de producción</small></div></div><div class="login-demo mt"><h3>Inicio de sesión y sincronización</h3><p>La autenticación con Google no está conectada a este prototipo. No se solicitan contraseñas ni se simula una cuenta autenticada.</p></div><div class="stack mt">${btn('Mis guardados locales','route','bluebtn full','star','data-to="guardados"')}${btn('Preferencias','route','','settings','data-to="configuracion"')}</div>`),
'favorite':el=>favorite(el.dataset.id),'watch-add':()=>{if(!state.favorites.includes('cin-mil'))favorite('cin-mil');else toast('Este análisis ya está en Mis picks.')},'share':()=>openModal('Compartir la lectura',`<p>Comparte el resumen de la demostración, identificado como tal. No se publican datos ni selecciones en la app.</p><textarea class="input" rows="10" readonly aria-label="Resumen para compartir">${esc(summaryText())}</textarea><div class="modal-actions">${btn('Copiar resumen','copy-summary','bluebtn','copy')}${btn('Descargar','export-summary','','download')}</div>`),'copy-summary':()=>copyText(summaryText()),'export-summary':()=>download('AA_Sports_Resumen_DEMO.txt',summaryText()),
'pitcher':el=>{state.pitcher=el.dataset.team;render()},'pitcher-detail':el=>pitcherDetail(el.dataset.team),'batter-detail':el=>batterDetail(el.dataset.id),'pitcherinfo':()=>openModal('Victorias: ¿de quién?',`<p><strong>Pitcher:</strong> victorias / (victorias + derrotas). No incluye las actuaciones sin decisión.</p><p><strong>Equipo:</strong> victorias del equipo / aperturas finalizadas del pitcher ante ese rival.</p><p>Todos los conteos aquí son ficticios. Ninguno de esos porcentajes equivale a la probabilidad de ganar el partido de hoy.</p>`),'team':el=>{state.team=el.dataset.team;render()},'props-team':el=>{state.propsTeam=el.dataset.team;render()},'trend':el=>{state.trend=el.dataset.trend;render()},'offense':el=>{state.formMetric=el.dataset.metric;render()},'offenseinfo':offenseInfo,'park':()=>openModal('Parque y condiciones',parkContent()),'probinfo':()=>openModal('Probabilidad del diseño',`<p><strong>64.6% para MIL y 35.4% para CIN</strong> son cifras de demostración. Suman 100% y permanecen consistentes en la interfaz.</p><p>El aro visual, la tabla y el texto usan la misma precisión. La frecuencia simulada puede variar y se etiqueta por separado.</p><p>No se ha consultado el pronóstico real de este encuentro.</p>`),'valueinfo':()=>openModal('Diferencia no equivale a rentabilidad',`<p>La diferencia entre 64.6% del escenario AA y ${(fair()*100).toFixed(1)}% del mercado de ejemplo es <strong>${diffText()}</strong>.</p><p>Se retira el margen normalizando las probabilidades implícitas de ambos lados. Esto no demuestra que la estimación del modelo sea correcta.</p><p>Por eso esta propuesta usa <strong>“Valor económico: no confirmado”</strong>, en lugar de etiquetar la apuesta como de bajo riesgo.</p>${btn('Abrir calculadora didáctica','route','bluebtn','arrow','data-to="herramientas"')}`),'prop':el=>{state.prop=el.dataset.prop;render()},'batter-props':el=>{state.propsTeam=el.dataset.team;navigate('jugadores')},'add-prop':el=>{const b=batters.find(b=>b.id===el.dataset.id),kind=propTypes[state.prop];if(b)addLeg({id:`prop:${b.id}:${state.prop}`,title:b.name+' · '+kind.name,sub:`${b.team} · ${b.games.filter(kind.test).length}/30 partidos ficticios · no es pronóstico`,market:'Jugadores'})},'add-leg':el=>{const x=comboCandidates().find(x=>x.id===el.dataset.id);if(x)addLeg(x)},'remove-leg':el=>{state.combo=state.combo.filter(x=>x.id!==el.dataset.id);render()},'clear-combo':()=>{state.combo=[];render();toast('Comparación vaciada.')},
'save-combo':()=>{if(state.combo.length<2){toast('Añade al menos dos selecciones para guardar la comparación.');return}openModal('Guardar comparación local',`<label class="tool-label" for="combo-name">Nombre</label><input id="combo-name" class="input" maxlength="80" value="Reds–Brewers · ${state.combo.length} selecciones"><p class="subnote mt">Sin probabilidad conjunta, sin apuesta y sin sincronización con servidor.</p><div class="modal-actions">${btn('Cancelar','close-modal')}${btn('Guardar','confirm-save-combo','greenbtn','star')}</div>`)},'confirm-save-combo':()=>{const name=$('#combo-name').value.trim()||'Comparación de ejemplo';state.savedCombos.push({name,legs:state.combo.map(x=>({...x})),created:new Date().toISOString()});persist('combos',state.savedCombos);closeModal();toast('Comparación guardada en este navegador.')},'load-combo':el=>{const c=state.savedCombos[Number(el.dataset.index)];if(c){state.combo=c.legs.map(x=>({...x}));navigate('combos')}},'delete-saved-combo':el=>{state.savedCombos.splice(Number(el.dataset.index),1);persist('combos',state.savedCombos);render();toast('Comparación eliminada.')},'validation':el=>validation(el.dataset.market),
'run-sim':async()=>{if(state.simBusy)return;state.simBusy=true;render();await new Promise(r=>setTimeout(r,45));const n=state.simN,seed=20260913+(state.sim?.iteration||0),rand=rng(seed);let w=0;for(let i=0;i<n;i++)if(rand()<.646)w++;state.sim={n,w,seed,iteration:(state.sim?.iteration||0)+1};state.simBusy=false;render();toast(`${n.toLocaleString('es')} ensayos calculados localmente.`)},'export-sim':()=>{if(state.sim)download('AA_Sports_Simulacion_DEMO.json',JSON.stringify({disclaimer:'Simulación binomial didáctica. No predicción real.',p:.646,...state.sim},null,2),'application/json')},'siminfo':()=>openModal('Qué hace esta simulación',`<p>Se ejecutan N ensayos binomiales. Cada ensayo usa p=0.646 para Milwaukee y p=0.354 para Cincinnati, con una semilla reproducible.</p><p>El error Monte Carlo mostrado es aproximadamente 1.96 × √(p(1−p)/N). Describe la variabilidad de la simulación, <strong>no la incertidumbre ni la calidad del modelo</strong>.</p><p>Esta simulación no calcula carreras, props, ROI o probabilidad conjunta de combos.</p>`),'totalinfo':()=>openModal('Explorador de totales · didáctico',`<p>La demo utiliza una distribución Poisson con media fija 8.7. Al mover la línea, se suman las probabilidades correspondientes a alta, baja y empate exacto de línea.</p><p>La media es ficticia y no se estima desde los promedios mostrados. El explorador ilustra la interacción del diseño; no es un modelo entrenado de totales MLB.</p><p>Para publicar un pronóstico real hacen falta datos pregame, reglas de liquidación, calibración y validación temporal por mercado.</p>`),
'book':el=>{state.book=el.dataset.book;render()},'odds-format':()=>{state.format=state.format==='american'?'decimal':'american';persist('format',state.format);render()},'game':el=>handleGame(el.dataset.id),'gamefilter':el=>{state.gameFilter=el.dataset.filter;render()},'date-prev':()=>shiftDate(-1),'date-next':()=>shiftDate(1),'date-reset':()=>{state.date='2026-09-13';render()},'history-filter':el=>{state.historyFilter=el.dataset.filter;render()},'team-info':el=>{const t=el.dataset.team;openModal('Equipo · '+esc(t),`<p>Fila de clasificación ficticia. Esta interacción abre la ficha del equipo sin atribuirle estadísticas de otro club.</p><p>El detalle de enfrentamientos del prototipo está desarrollado para Cincinnati Reds y Milwaukee Brewers.</p>${btn('Abrir comparación Reds–Brewers','route','bluebtn','arrow','data-to="equipos"')}`)},'export-history':()=>download('AA_Sports_Historial_DEMO.csv','DEMO - NO RESULTADOS REALES\nfecha,encuentro,seleccion,probabilidad,resultado\n'+historyRows.map(r=>[r.date,r.match,r.pick,r.p,r.result].join(',')).join('\n'),'text/csv;charset=utf-8'),
'export-saved':()=>download('AA_Sports_Seguimiento_DEMO.json',JSON.stringify({disclaimer:'Datos locales del prototipo. No son apuestas ni estadísticas reales.',favorites:state.favorites,comparisons:state.savedCombos,checklist:state.checklist},null,2),'application/json'),'states':statesModal,'set-state':el=>{state.dataState=el.dataset.state;closeModal();if(!isDetail())navigate(state.dataState==='pending'?'bateadores':'resumen');else render();toast('Estado de interfaz simulado.')},'restore':()=>{state.dataState='demo';render();toast('Escenario local restaurado. No se hizo una solicitud a la API.')},
'privacy':()=>openModal('Privacidad del prototipo',`<p>Este archivo no hace solicitudes de red ni incluye servicios de analítica. Los recursos visuales se incluyen con el proyecto.</p><p>El almacenamiento local conserva tus elecciones de diseño y seguimiento. Puedes exportarlas o borrarlas desde Configuración.</p><p>No se solicitan claves, contraseñas ni información de pago. La autenticación de la aplicación real queda fuera de esta entrega.</p>${btn('Abrir preferencias','route','outline-blue','settings','data-to="configuracion"')}`),'terms':()=>openModal('Sobre esta demostración',`<p>Prototipo de interfaz de AA Sports para evaluación de producto. Todos los datos de rendimiento, precios y predicciones son ilustrativos.</p><p>No acepta dinero, no ejecuta apuestas ni garantiza resultados. Los retratos proceden de una imagen generada; no deben utilizarse como fotografías verificadas de atletas.</p><p>Los logotipos y nombres deportivos se conservan como parte de la referencia proporcionada. No implican afiliación.</p>`),

function shiftDate(d){const date=new Date(state.date+'T12:00:00Z');if(!Number.isFinite(+date))return;date.setUTCDate(date.getUTCDate()+d);state.date=date.toISOString().slice(0,10);render()}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=actions[el.dataset.action];if(action){try{await action(el)}catch(error){console.error(error);toast('No se pudo completar esta acción local.')}}});
document.addEventListener('input',e=>{if(e.target.id==='global-search'){updateSearch(e.target.value);return}const k=e.target.dataset.input;if(!k)return;if(k==='totalLine'){state.line=Number(e.target.value);$('#line-output').textContent=state.line.toFixed(1);$('#total-result').innerHTML=totalResults();$$('.bar-chart .baritem').forEach((el,i)=>el.classList.toggle('goldbar',i>state.line));return}if(k==='batterQuery'){state.batterQuery=e.target.value;$('#batter-table').innerHTML=battingTable();return}if(k==='listQuery'){state.listQuery=e.target.value;const list=gamesForSport().filter(g=>(state.gameFilter==='Todos'||g.status===state.gameFilter)&&(g.awayName+' '+g.homeName).toLowerCase().includes(state.listQuery.toLowerCase()));$('#games-results').innerHTML=state.date==='2026-09-13'?gameListRows(list)||'<div class="empty"><h3>Sin coincidencias</h3><p>Prueba otro término.</p></div>':'<div class="empty"><h3>No hay fixture en esta fecha</h3></div>';return}if(k==='calcPrice'||k==='calcProbability'){state[k]=e.target.value===''?NaN:Number(e.target.value);$('#calc-output').innerHTML=calcOutput()}});
document.addEventListener('change',e=>{const k=e.target.dataset.change;if(k){let value=e.target.value;if(k==='simN')value=Number(value);if(k==='reduced')value=e.target.checked;state[k]=value;if(['theme','format','reduced'].includes(k))persist(k,value);if(k==='sport')state.gameFilter='Todos';render()}const check=e.target.dataset.check;if(check){state.checklist[check]=e.target.checked;persist('checklist',state.checklist)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const rect=e.target.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeModal()}});
window.addEventListener('popstate',()=>{const route=location.hash.slice(1);if([...mainTabs.map(x=>x[0]),...sideNav.map(x=>x[0]),'posiciones','historial','cerebro','configuracion'].includes(route)){state.route=route;closeModal();render(false);window.scrollTo(0,0)}});
const initialRoute=location.hash.slice(1);if([...mainTabs.map(x=>x[0]),...sideNav.map(x=>x[0]),'posiciones','historial','cerebro','configuracion'].includes(initialRoute))state.route=initialRoute;
render();
