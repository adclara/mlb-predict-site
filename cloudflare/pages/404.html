<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — AA Sports</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2394d3ff'/%3E%3Cstop offset='.55' stop-color='%234da8ff'/%3E%3Cstop offset='1' stop-color='%2332dfb4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23060c15'/%3E%3Cg transform='skewX(-9)' fill='url(%23g)'%3E%3Cpath d='M22 46 L32 18 L38 18 L28 46 Z'/%3E%3Cpath d='M36 46 L46 18 L52 18 L42 46 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Mismos valores que la capa AA_TOKENS_V2 de la app (página standalone). */
:root{
  --page:#060c15; --panel:#0b1624e6; --hair:#21354c; --hair-2:#2d4a68;
  --text:#f2f5fc; --dim:#a0b0c6; --faint:#7d91aa; --sky:#4da8ff;
  --grad:linear-gradient(100deg,#94d3ff,#1c87e9 55%,#32dfb4);
  --font-ui:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Barlow Condensed",Manrope,sans-serif;
}
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--text);
  font:15px/1.6 var(--font-ui);padding:24px;text-align:center}
.card{max-width:440px;padding:36px 30px;border:1px solid var(--hair);border-radius:16px;
  background:linear-gradient(145deg,#0c1929,#091421 85%)}
.wm{font-family:var(--font-display);font-size:30px;font-weight:700;font-style:italic;letter-spacing:.04em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.code{font-family:var(--font-display);font-size:72px;font-weight:700;line-height:1;margin:18px 0 6px;color:var(--sky)}
h1{font-size:17px;font-weight:800;margin-bottom:8px}
p{color:var(--dim);font-size:13.5px}
a{display:inline-block;margin-top:22px;padding:11px 20px;border:1px solid var(--hair-2);border-radius:10px;
  color:var(--sky);font-weight:800;text-decoration:none}
a:hover{border-color:var(--sky)}
</style>
</head>
<body>
<div class="card">
  <div class="wm">AA SPORTS</div>
  <div class="code">404</div>
  <h1 id="ttl">Esta página no existe</h1>
  <p id="msg">El enlace puede haber cambiado. Los datos de hoy están en Inicio.</p>
  <a href="/" id="cta">Ir a Inicio →</a>
</div>
<script>
// Mismo criterio que la app: navegador en* → EN, cualquier otro → ES.
if (String(navigator.language || '').toLowerCase().startsWith('en')) {
  document.documentElement.lang = 'en';
  document.getElementById('ttl').textContent = 'This page does not exist';
  document.getElementById('msg').textContent = 'The link may have changed. Today’s data lives on Home.';
  document.getElementById('cta').textContent = 'Go to Home →';
}
</script>
</body>
</html>
