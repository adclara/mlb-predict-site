name: Assemble reviewed reliability changes on isolated branch
on:
  push:
    branches: [improvement/reliability-20260912]
    paths: ['.github/workflows/reliability-branch.yml', '.github/reliability.patch.*']
permissions:
  contents: write
concurrency:
  group: reliability-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'adclara/mlb-predict-site' && github.ref == 'refs/heads/improvement/reliability-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify exact reviewed patch and allowed source paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, subprocess
          parts = [Path('.github/reliability.patch.'+str(i).zfill(2)).read_text() for i in (1,2,3)]
          # Correct one transport transcription character before checking the exact reviewed digest.
          parts[1] = parts[1].replace('Nv3j3vn7wT76r', 'Nv3j3vn7w76r')
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ceae0528bcc8579aeb012c4f1fd18086c79256a115c66bfa2b687a9a7a3999ce', 'reviewed patch mismatch'
          dest = Path('/tmp/reliability-reviewed.patch'); dest.write_bytes(patch)
          allowed = {'cloudflare/lib/basketball_health.mjs','cloudflare/lib/normalize.mjs','cloudflare/migrations/0009_basketball_producer_health.sql','cloudflare/pages/index.html','cloudflare/worker/index.js','robot/basketball_heartbeat.mjs','robot/nba_shadow.mjs','robot/odds.js','robot/site_browser_audit.cjs','robot/sport_brain.mjs','robot/wnba_publish_simulation.mjs','tests/basketball_capture_integration.test.mjs','tests/basketball_producer_health.test.mjs','tests/mlb_normalize_observed.test.mjs','tests/prediction_messaging.test.mjs','tests/reliability_ui_test.mjs'}
          paths = {line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(dest)],text=True).splitlines()}
          assert paths == allowed, 'unexpected patch paths'
          subprocess.run(['git','apply','--check',str(dest)],check=True)
          subprocess.run(['git','apply','--index',str(dest)],check=True)
          PY
      - name: Run full unit regression before committing source
        run: |
          mkdir -p reliability-results
          node --check cloudflare/worker/index.js
          node --check robot/basketball_heartbeat.mjs
          node --check robot/nba_shadow.mjs
          node --check robot/odds.js
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee reliability-results/unit-tests.log
      - name: Commit only the reviewed patch to the isolated improvement branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/improvement/reliability-20260912
          current=$(git ls-remote origin refs/heads/improvement/reliability-20260912 | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement independent producer health and evidence-first UI contracts'
          git push origin HEAD:refs/heads/improvement/reliability-20260912
          git rev-parse HEAD > reliability-results/commit.txt
      - name: Capture implementation and test evidence
        if: always()
        run: |
          mkdir -p reliability-results
          git archive --format=tar.gz HEAD > reliability-results/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-assembly-evidence
          path: reliability-results/
          retention-days: 3
