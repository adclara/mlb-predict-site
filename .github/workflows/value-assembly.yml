name: Assemble reviewed calibrated value changes
on:
  push:
    branches: [improvement/value-engine-20260912]
    paths: ['.github/workflows/value-assembly.yml', '.ops/value-*.gzpart']
permissions:
  contents: write
concurrency:
  group: value-assembly-20260912
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify exact patch, allowed paths and resulting source hashes
        run: |
          python3 - <<'PY'
          import gzip, hashlib, pathlib, subprocess
          expected = {
            '.github/workflows/reliability-ci.yml': '24f11943736939120ab2250d8e8a470951a620df',
            'cloudflare/lib/normalize.mjs': '89091c51fb6953a144b471f03cd056f8f8d9d992',
            'cloudflare/lib/value_contract.mjs': '2dcabf29cef58a81451ead73a2e8dbd51e271e29',
            'cloudflare/pages/index.html': '1d427355f1d5d0988943ae433558de46e0e12321',
            'docs/VALUE_ENGINE.md': '8865c8352f14b7417accc3bab609e6487f55b62a',
            'robot/daily.mjs': '70b17ef6df3b23c6a742a87f5e2ad0555b758e8d',
            'robot/espn_odds.mjs': '4fcb7cb594eca585059f559dadc9aa3e4a74b509',
            'robot/value_decision.mjs': '0b52e98a258b013b87c6d0b59eb8fb9688dd93d4',
            'tests/value_engine.test.mjs': '7ad5c9161f2c8fb900fb92a13de0f7ed45475229',
            'tests/value_ui_test.mjs': 'bf0e0388b15ce77e20c98a90f06deb48246fbbbb',
          }
          compressed = b''.join(pathlib.Path(f'.ops/value-{i}.gzpart').read_bytes() for i in range(6))
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '6f0f01a82b0c8ae78b3d9b8ecf8f5ef43e0d01b5f7fd3e1e02d3954dcb6c73ce', 'patch checksum mismatch'
          stats = subprocess.check_output(['git', 'apply', '--numstat'], input=patch).decode()
          paths = {line.split('\t', 2)[2] for line in stats.splitlines()}
          assert paths == set(expected), f'unexpected paths: {paths}'
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index'], input=patch, check=True)
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path]).decode().strip()
              assert actual == sha, f'source hash mismatch: {path}'
          print('Exact reviewed patch and all ten source hashes verified.')
          PY
      - name: Complete unit and syntax validation before commit
        run: |
          mkdir -p value-assembly-results
          node --check robot/daily.mjs
          node --check robot/value_decision.mjs
          node --check robot/espn_odds.mjs
          node --check cloudflare/lib/normalize.mjs
          node --check cloudflare/lib/value_contract.mjs
          git diff --check --cached
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee value-assembly-results/unit-tests.log
      - name: Commit verified source only to isolated improvement branch
        run: |
          git rm .ops/value-*.gzpart .github/workflows/value-assembly.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify calibrated EV and add prospective two-sided value research ledger'
          git push origin HEAD:refs/heads/improvement/value-engine-20260912
          git rev-parse HEAD > value-assembly-results/commit.txt
          git archive --format=tar.gz HEAD > value-assembly-results/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: value-assembly-evidence
          path: value-assembly-results/
          retention-days: 7
