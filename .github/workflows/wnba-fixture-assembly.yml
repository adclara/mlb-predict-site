name: Assemble reviewed scroll fixture synchronization
on:
  push:
    branches: [fix/wnba-scheduler-recovery-20260927]
    paths: ['.github/workflows/wnba-fixture-assembly.yml']
permissions:
  contents: write
concurrency:
  group: wnba-fixture-assembly
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply only the reviewed fixture synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/history_router_ui_test.mjs')
          original=p.read_bytes()
          blob=lambda b: hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(original)=='e2e05b9b9765586b53804aff1c1a6aa250faad32'
          s=original.decode()
          needle="const assertClean = (errors, label) => assert.deepEqual(errors, [], `${label}: console ${errors.join(' | ')}`);"
          helper="""
          // Fixture preparation, not a relaxation of Back/Forward assertions. The router
          // finishes list restoration on two frames plus an 80ms WebKit reassertion.
          // Do not inject a synthetic user scroll while that initial work is in flight.
          async function settleRouteBeforeScrollFixture(page) {
            await page.waitForFunction(() => !_aaFromPop);
            const state = await page.evaluate(async () => {
              const key = history.state?.key;
              await new Promise(done => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(done, 120))));
              return { key, currentKey: history.state?.key, applying: _aaFromPop };
            });
            assert.equal(state.applying, false, 'fixture route is still applying');
            assert.equal(state.currentKey, state.key, 'fixture preparation crossed a navigation');
          }
          """
          assert s.count(needle)==1;s=s.replace(needle,needle+'\n'+helper)
          needle2="""    await waitForMlb(run.page);
              await run.page.evaluate(() => {
                const spacer = document.createElement('div');"""
          assert s.count(needle2)==1;s=s.replace(needle2,"""    await waitForMlb(run.page);
              await settleRouteBeforeScrollFixture(run.page);
              await run.page.evaluate(() => {
                const spacer = document.createElement('div');""")
          needle3="""    assert.equal(archiveEntry.state.scrollY, 0);
          
              await run.page.locator('.pill[data-f="pre"]').click();"""
          assert s.count(needle3)==1;s=s.replace(needle3,"""    assert.equal(archiveEntry.state.scrollY, 0);
          
              await settleRouteBeforeScrollFixture(run.page);
              await run.page.locator('.pill[data-f="pre"]').click();""")
          assert blob(s.encode())=='793dee368ac3ef753d08c84e8295d0d9049862f1'
          p.write_text(s)
          print('Exact fixture change verified; no assertions removed.')
          PY
          node --check tests/history_router_ui_test.mjs
          git diff --check
          test "$(git diff --name-only)" = 'tests/history_router_ui_test.mjs'
      - name: Commit only the fixture on the isolated repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/history_router_ui_test.mjs
          git commit -m 'Wait for initial route restoration before synthetic scroll fixtures'
          git push origin HEAD:refs/heads/fix/wnba-scheduler-recovery-20260927
