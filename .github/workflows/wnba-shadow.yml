# AA Sports — WNBA en sombra. Registra y gradea predicciones privadas con un
# Elo/MOV ajustado solo en temporadas WNBA. Nunca publica picks hasta que pase
# muestra forward + calibración + mercado y exista aprobación humana.
name: wnba-shadow
on:
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/poke-wnba']
permissions:
  contents: read
concurrency:
  group: wnba-shadow
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AA_REQUIRE_PRODUCER_EVIDENCE: '1'
      AA_PRODUCER_EVIDENCE: /tmp/aa-wnba-producer-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Begin independent producer attempt
        id: producer_attempt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node robot/basketball_heartbeat.mjs begin wnba
      - name: Restaurar histórico y box scores incrementales WNBA
        uses: actions/cache/restore@v6
        with:
          path: data/fase2/wnba
          key: wnba-shadow-${{ github.run_id }}
          restore-keys: wnba-history-
      - name: Verificar histórico y backtest WNBA
        if: github.event_name != 'schedule'
        run: |
          test -f data/fase2/wnba/wnba_backtest.json
          node robot/wnba_model.mjs backtest 2
          node robot/wnba_player_model.mjs --no-write
          node robot/wnba_market_model.mjs --no-write
          node robot/wnba_player_winner.mjs --no-write
      - name: Capturar y gradear WNBA en sombra
        env:
          AA_BASKETBALL_SPORT: wnba
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node robot/nba_shadow.mjs
      - name: Publicar Cerebro WNBA medido (sin picks públicos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node robot/sport_brain.mjs wnba
      - name: Publicar contratos de mercados y simulación (gates cerrados)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node robot/wnba_publish_simulation.mjs
      - name: Record successful producer completion with capture evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node robot/basketball_heartbeat.mjs success wnba
      - name: Record failed producer attempt without refreshing last success
        if: failure() && steps.producer_attempt.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node robot/basketball_heartbeat.mjs failure wnba
