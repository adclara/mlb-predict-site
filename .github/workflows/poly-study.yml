name: poly-study-paused
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: poly-study
  cancel-in-progress: false
jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Radar detenido
        run: echo "Radar de Polymarket pausado; no se consulta ni publica ningún dato."
