name: Assemble reviewed cache compatibility guard
on:
  push:
    branches: [improvement/cache-guard-20260912]
    paths: ['.github/cache-guard.json', '.github/workflows/cache-guard-assembly.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'adclara/mlb-predict-site' && github.ref == 'refs/heads/improvement/cache-guard-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply only exact reviewed replacements and verify source checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          changes=json.loads(Path('.github/cache-guard.json').read_text())
          allowed={'cloudflare/pages/index.html','cloudflare/lib/normalize.mjs','tests/reliability_ui_test.mjs','tests/legacy_evidence_ui.test.mjs'}
          assert set(changes)==allowed
          for path,change in changes.items():
            p=Path(path)
            if change['sha256_before'] is None:
              assert not p.exists(), path
              text=change['content']
            else:
              text=p.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==change['sha256_before'],path
              for old,new in change['replacements']:
                assert text.count(old)==1,path
                text=text.replace(old,new,1)
            assert hashlib.sha256(text.encode()).hexdigest()==change['sha256_after'],path
            p.write_text(text)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
      - name: Test before committing any application source
        run: |
          mkdir -p guard-results
          node --check cloudflare/lib/normalize.mjs
          node --check tests/reliability_ui_test.mjs
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee guard-results/unit-tests.log
      - name: Commit to the isolated child branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/improvement/cache-guard-20260912
          current=$(git ls-remote origin refs/heads/improvement/cache-guard-20260912 | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Guard legacy cached risk and verdicts; improve monitoring readability'
          git push origin HEAD:refs/heads/improvement/cache-guard-20260912
          git rev-parse HEAD > guard-results/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-guard-assembly-evidence
          path: guard-results/
          retention-days: 3
