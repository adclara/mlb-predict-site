name: Stage verified MLB standings repair
on:
  push:
    branches: ['audit/aasport-health-20260912']
    paths: ['.github/workflows/aasport-stage-standings-repair.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply narrow, guarded parser integration on the audit branch only
        run: |
          test "$GITHUB_REF_NAME" = 'audit/aasport-health-20260912'
          python3 <<'PY'
          from pathlib import Path
          path = Path('cloudflare/worker/index.js')
          text = path.read_text()
          patches = [
            ("const ESPN_SCOREBOARD =", "import { mlbStandingsRequest, parseMlbStandings } from '../lib/mlb_standings.mjs';\n\nconst ESPN_SCOREBOARD ="),
            ("      if (path === '/v1/mlb/standings') return await standings(ctx, origin, 'mlb-div', 'https://site.api.espn.com/apis/v2/sports/baseball/mlb/standings?level=3', 'https://site.api.espn.com/apis/v2/sports/baseball/mlb/standings');", "      if (path === '/v1/mlb/standings') {\n        const request = mlbStandingsRequest();\n        return await standings(ctx, origin, request.cacheTag, request.upstream, request.alternate, request.season);\n      }"),
            ("async function standings(ctx, origin, cacheTag, upstream, altUpstream) {", "async function standings(ctx, origin, cacheTag, upstream, altUpstream, expectedMlbSeason = null) {"),
            ("  const parse = (data) => {\n    let sections = (data.children || []).flatMap(collect).filter((s) => s.rows.length);", "  const parse = (data) => {\n    if (expectedMlbSeason !== null) return parseMlbStandings(data, expectedMlbSeason);\n    let sections = (data.children || []).flatMap(collect).filter((s) => s.rows.length);"),
          ]
          for before, after in patches:
              if text.count(before) != 1:
                  raise RuntimeError('Expected exactly one replacement anchor: ' + before[:100])
              text = text.replace(before, after, 1)
          path.write_text(text)
          test_path = Path('tests/worker_espn_public_fallback.test.mjs')
          text = test_path.read_text()
          old = "season: { displayName: '2026' },"
          assert text.count(old) == 1
          test_path.write_text(text.replace(old, "season: { displayName: etToday().slice(0, 4) },", 1))
          PY
      - name: Validate syntax and full regression suite before committing
        run: |
          mkdir -p audit-results
          node --check cloudflare/worker/index.js
          node --check cloudflare/lib/mlb_standings.mjs
          git diff --check
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee audit-results/standings-full-tests.log
      - name: Commit only the reviewed integration and fixture update
        run: |
          test "$GITHUB_REF_NAME" = 'audit/aasport-health-20260912'
          git diff -- cloudflare/worker/index.js tests/worker_espn_public_fallback.test.mjs > audit-results/standings-integration.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/worker/index.js tests/worker_espn_public_fallback.test.mjs
          git commit -m 'fix: pin MLB standings season and normalize division order'
          git push origin "HEAD:$GITHUB_REF_NAME"
          git rev-parse HEAD > audit-results/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aasport-standings-repair-validation
          path: audit-results/
          retention-days: 7
