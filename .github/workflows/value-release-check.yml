name: Read-only final value release verification
on:
  push:
    branches: [verify/value-release-20260912]
    paths: ['.github/workflows/value-release-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify actual public arithmetic and immutable old/new research rows
        run: |
          mkdir -p value-production-results
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {digest} from './robot/value_decision.mjs';
          const out='value-production-results';
          const report={observed_at:new Date().toISOString(),checks:[],values:[],errors:[],execution_verified:false};
          function check(name,fn){try{fn();report.checks.push({name,passed:true});}catch(e){report.checks.push({name,passed:false});report.errors.push(`${name}: ${e.message}`);}}
          try{
            const ledger=JSON.parse(readFileSync('data/history/value_decisions/2026-09-12.json','utf8'));
            check('original_15_snapshots_unchanged',()=>assert.equal(digest(ledger.snapshots.slice(0,15)),'f1f8a9a489d86f80ee0c67b696acc6354e580919ab2df58b6dcddda6358de602'));
            check('all_snapshot_hashes_valid',()=>{for(const s of ledger.snapshots){const{id,...payload}=s;assert.equal(id,digest(payload));assert.equal(s.public_picks_enabled,false);assert.equal(s.execution_verified,false);}});
            const corrected=ledger.snapshots.filter(s=>Number.isFinite(s.seconds_before_start));
            check('corrected_producer_has_run',()=>assert.ok(corrected.length>=15));
            check('signed_time_and_after_start_labels',()=>{for(const s of corrected){const seconds=(Date.parse(s.start)-Date.parse(s.evaluated_at))/1000;assert.equal(s.seconds_before_start,seconds);if(seconds<=0){assert.equal(s.horizon,'after_start');assert.equal(s.action,'abstain');assert.equal(s.paper_selected,false);}}});
            report.ledger={date:ledger.date,snapshots:ledger.snapshots.length,corrected_snapshots:corrected.length,original_snapshots_preserved:report.checks[0].passed,paper_selected:ledger.snapshots.filter(s=>s.paper_selected).length,settlements:Object.keys(ledger.settlements||{}).length,updated_at:ledger.updated_at};
            writeFileSync(`${out}/research-ledger.json`,JSON.stringify(ledger,null,2));
            const response=await fetch('https://aa-sports-api.opsmira9.workers.dev/v1/mlb/today',{signal:AbortSignal.timeout(30000)});
            assert.equal(response.status,200);const doc=await response.json();writeFileSync(`${out}/mlb-today.json`,JSON.stringify(doc,null,2));
            const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(new Date());
            check('current_public_date',()=>assert.equal(doc.date,today));
            for(const event of doc.events||[]){
              const v=event.snapshot?.value,pred=event.prediction;if(!v)continue;
              check(`calibrated_value_${event.event_id}`,()=>{
                assert.equal(v.schema,'aa-value-v1');assert.equal(v.public_recommendation,false);assert.equal(v.action,'comparison_only');assert.equal(v.price_scope,'frozen_capture');
                assert.ok(['p_final','prob_v2'].includes(v.probability_source));assert.equal(v.probability_source,pred.probability_source);
                const side=pred.pick===event.home.code?'home':'away';assert.ok(Math.abs(v[side].model_pct-pred.prob_pct)<.001);assert.ok(Math.abs(v.home.model_pct+v.away.model_pct-100)<.001);
                for(const side of ['home','away']){const s=v[side];assert.ok(Number.isFinite(s.price)&&Math.abs(s.price)>=100);const decimal=s.price>0?1+s.price/100:1+100/Math.abs(s.price);const expected=Math.round((s.model_pct/100*decimal-1)*1000)/10;assert.ok(Math.abs(s.ev_pct-expected)<=.100001);}
                if(v.best_side)assert.ok(v[v.best_side].ev_pct>=0);
              });
              report.values.push({event_id:event.event_id,pick:pred.pick,display_probability:pred.prob_pct,value:v});
            }
            report.value_rows=report.values.length;check('real_priced_rows_available',()=>assert.ok(report.value_rows>0));
          }catch(e){report.errors.push(e.stack||e.message);}
          report.fully_verified=report.errors.length===0;report.finished_at=new Date().toISOString();
          writeFileSync(`${out}/report.json`,JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          if(!report.fully_verified)process.exitCode=1;
          JS
      - name: Record inspected source revision
        if: always()
        run: git rev-parse HEAD > value-production-results/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: value-production-final
          path: value-production-results/
          retention-days: 7
