# AA Sports — deploy de producción (Worker + Pages) desde Actions, con el
# token de Cloudflare. Adrian ya no necesita correr wrangler en su Mac:
# poke a .github/poke-deploy y esto publica lo último de main.
name: deploy
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/poke-deploy']
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Regresión de lógica — MLB causal, ingesta, mercados sombra y Radar pausado
        run: node --test tests/mlb_live_date.test.mjs tests/mlb_lock_gate.test.mjs tests/mlb_market_lab.test.mjs tests/mlb_selection_policy.test.mjs tests/mlb_ledger_migration.test.mjs tests/mlb_ledger_integrity.test.mjs tests/mlb_model_integrity.test.mjs tests/mlb_aa_lab.test.mjs tests/mlb_publish_watchdog.test.mjs tests/mlb_publication_health.test.mjs tests/mlb_schedule_contract.test.mjs tests/mlb_ingest_consumer.test.mjs tests/mlb_normalize_observed.test.mjs tests/mlb_content_hash.test.mjs tests/mlb_upload_guard.test.mjs tests/mlb_learning_guard.test.mjs tests/ncaaf_context.test.mjs tests/sport_brain.test.mjs tests/wnba_model.test.mjs tests/wnba_market_model.test.mjs tests/wnba_player_winner.test.mjs tests/worker_mlb_ingest.test.mjs tests/worker_espn_public_fallback.test.mjs tests/us_sports_foundation.test.mjs tests/poly_paused.test.mjs tests/market_intelligence.test.mjs tests/worker_intelligence.test.mjs tests/intelligence_health.test.mjs tests/intelligence_workflow.test.mjs
      - name: Producción = main (fix de production branch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          URL=https://api.cloudflare.com/client/v4/accounts/f02574feb7272a1da2818e35e0ff4342/pages/projects/aa-sports
          BODY=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$URL")
          CUR=$(BODY="$BODY" node -e 'const j=JSON.parse(process.env.BODY); if(j.success!==true) process.exit(1); process.stdout.write(String(j.result?.production_branch||""))')
          echo "rama de producción actual: $CUR"
          if [ "$CUR" != main ]; then
            PATCH=$(curl -fsS -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "content-type: application/json" -d '{"production_branch":"main"}' "$URL")
            PATCH="$PATCH" node -e 'const j=JSON.parse(process.env.PATCH); if(j.success!==true || j.result?.production_branch!=="main") process.exit(1)'
          fi
          VERIFY=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$URL")
          VERIFY="$VERIFY" node -e 'const j=JSON.parse(process.env.VERIFY); if(j.success!==true || j.result?.production_branch!=="main") process.exit(1)'
          echo "✅ rama de producción verificada: main"
      - name: Preparar D1 (migraciones)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f02574feb7272a1da2818e35e0ff4342
        run: |
          npx --yes wrangler@4.112.0 d1 migrations apply aa-sports --remote
      - name: Sincronizar ledger público MLB por selección en D1
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node upload.mjs --backfill-d1-prices
      - name: Deploy Worker (API)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f02574feb7272a1da2818e35e0ff4342
        run: npx --yes wrangler@4.112.0 deploy
      - name: Reconciliar snapshot de Central AA tras el deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          AA_INTELLIGENCE_MIN_AGE_MINUTES: '30'
          AA_INTELLIGENCE_TRIGGER: deploy
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          node robot/market_intelligence.mjs
      - name: Allowlist del QA privado (si está configurada)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f02574feb7272a1da2818e35e0ff4342
          QA_ALLOWED_EMAILS: ${{ secrets.QA_ALLOWED_EMAILS }}
        run: |
          if [ -z "$QA_ALLOWED_EMAILS" ]; then
            echo "⚠️ QA_ALLOWED_EMAILS no está configurado: qa.aasport.net quedará bloqueado (401/403), sin exponer shadow."
            exit 0
          fi
          printf '%s' "$QA_ALLOWED_EMAILS" | npx --yes wrangler@4.112.0 secret put QA_ALLOWED_EMAILS
          echo "✅ allowlist QA cargada al Worker (valor no impreso)."
      - name: Verificar cron deportivo y ausencia de crons Radar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SCHED=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts/f02574feb7272a1da2818e35e0ff4342/workers/scripts/aa-sports-api/schedules)
          echo "schedules: $(echo "$SCHED" | head -c 300)"
          SCHED_JSON="$SCHED" node <<'NODE'
          const body = JSON.parse(process.env.SCHED_JSON || '{}')
          if (body.success !== true) {
            console.error('❌ no se pudo leer schedules (API/token); no puedo probar que los crons quedaron activos')
            process.exit(1)
          }
          const rows = Array.isArray(body.result) ? body.result : (body.result?.schedules || [])
          const actual = new Set(rows.map((row) => row?.cron).filter(Boolean))
          const required = [
            ['*/20 * * * *', 'MLB + NFL/NCAAF/NHL/NCAAM: captura pública cada 20 min'],
          ]
          const forbidden = [
            ['*/5 * * * *', 'vigía Radar'],
            ['0 13 * * *', 'archivo diario Radar'],
          ]
          let missing = false
          for (const [cron, label] of required) {
            if (actual.has(cron)) console.log(`✅ ${label} — ${cron} REGISTRADO`)
            else { console.error(`❌ FALTA ${cron} — ${label}`); missing = true }
          }
          for (const [cron, label] of forbidden) {
            if (actual.has(cron)) { console.error(`❌ CRON RADAR AÚN ACTIVO ${cron} — ${label}`); missing = true }
            else console.log(`✅ ${label} detenido — ${cron} AUSENTE`)
          }
          if (missing) process.exit(1)
          NODE
      - name: Confirmar Radar y Telegram detenidos
        run: |
          echo "✅ deploy no carga secretos Telegram ni llama servicios externos del bot"
          echo "✅ Radar solo puede reactivarse mediante otro cambio de código"
      - name: Deploy Pages (app)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f02574feb7272a1da2818e35e0ff4342
        run: npx --yes wrangler@4.112.0 pages deploy pages --project-name=aa-sports --branch=main --commit-dirty=true
      - name: Conectar qa.aasport.net a Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node robot/subdomain_qa.mjs
      - name: Verificar y diagnosticar producción
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sleep 25
          for u in https://aasport.net/ https://www.aasport.net/ https://aa-sports-5ap.pages.dev/ https://main.aa-sports-5ap.pages.dev/; do
            echo "== $u"
            curl -s -D /tmp/h "$u" -o /tmp/b || { echo "  (no responde)"; continue; }
            grep -iE "^(cf-cache-status|etag|last-modified|age|location):" /tmp/h || true
            for m in authbox recentnote lotBoot dPick; do grep -q "$m" /tmp/b && echo "  marker $m: SI" || echo "  marker $m: no"; done
          done
          echo "== estado de dominios en Pages =="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts/f02574feb7272a1da2818e35e0ff4342/pages/projects/aa-sports/domains | head -c 2000; echo
          echo "== últimos deployments =="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/f02574feb7272a1da2818e35e0ff4342/pages/projects/aa-sports/deployments?per_page=3" \
            | tr ',' '\n' | grep -E '"id"|"environment"|"created_on"|"url"' | head -24
          BODY=$(curl -s https://aasport.net/)
          echo "$BODY" | grep -q 'id="authbox"' && echo "✅ aasport.net sirve la versión nueva" || echo "⚠️ aasport.net aún sirve versión vieja (ver diagnóstico)"
          echo "$BODY" | grep -q 'AA_MLB_LIVE_DATE_GUARD_V2' \
            && echo "✅ Pages contiene el candado MLB de fecha exacta" \
            || { echo "❌ Pages no contiene el candado MLB nuevo"; exit 1; }
          CSP=$(curl -sI https://aasport.net/ | tr -d '\r' | grep -i '^content-security-policy:' || true)
          echo "$CSP"
          echo "$CSP" | grep -q 'https://static.cloudflareinsights.com' \
            && echo "✅ CSP permite el script oficial de Cloudflare Web Analytics" \
            || { echo "❌ CSP bloquea el script de Cloudflare Web Analytics"; exit 1; }
          echo "$CSP" | grep -q 'https://cloudflareinsights.com' \
            && echo "✅ CSP permite el envío oficial de Web Analytics" \
            || { echo "❌ CSP bloquea el envío de Cloudflare Web Analytics"; exit 1; }
      - name: Diagnóstico semántico de producción
        run: |
          node robot/mlb_publication_health_check.mjs
          node robot/intelligence_health_check.mjs --max-age=45
          node robot/prod_diag.mjs
          healthy=0
          for i in $(seq 1 80); do
            BODY=$(curl -fsS https://aa-sports-api.opsmira9.workers.dev/v1/mlb/pipeline-health || true)
            echo "pipeline intento $i/80: $BODY"
            if BODY="$BODY" node -e 'const j=JSON.parse(process.env.BODY); process.exit(j.pipeline==="mlb_ingest_20m" && j.ok===true && j.fresh===true ? 0 : 1)'; then
              healthy=1
              break
            fi
            sleep 30
          done
          if [ "$healthy" -ne 1 ]; then
            echo "❌ la ingesta MLB no produjo un slot completo y fresco dentro de 40 minutos"
            exit 1
          fi
          echo "✅ ingesta MLB completa y fresca"
          us_healthy=0
          for i in $(seq 1 80); do
            all_ok=1
            for sport in nfl ncaaf nhl ncaam; do
              BODY=$(curl -fsS "https://aa-sports-api.opsmira9.workers.dev/v1/$sport/pipeline-health" || true)
              echo "$sport pipeline intento $i/80: $BODY"
              if ! BODY="$BODY" SPORT="$sport" node -e 'const j=JSON.parse(process.env.BODY); if(j.sport!==process.env.SPORT || j.ok!==true) process.exit(1)'; then
                all_ok=0
              fi
            done
            if [ "$all_ok" -eq 1 ]; then
              us_healthy=1
              break
            fi
            sleep 30
          done
          if [ "$us_healthy" -ne 1 ]; then
            echo "❌ la ingesta NFL/NCAAF/NHL/NCAAM no produjo slots frescos dentro de 40 minutos"
            exit 1
          fi
          echo "✅ ingesta pública NFL/NCAAF/NHL/NCAAM completa y fresca"
      - name: Gate de datos de producción
        run: |
          node robot/qa_check.mjs
          node robot/us_sports_qa.mjs
